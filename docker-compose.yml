version: '3.8'

services:
  # Serviço de Testes Unitários e Cobertura (CI local)
  auxcad-tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auxcad_test_suite
    environment:
      - PYTHONPATH=/app:/app/cqt:/app/ambiental:/app/orcamento:/app/topografia:/app/mapa_postes:/app/dados_tecnicos:/app/cpfc:/app/unifilar
    volumes:
      - .:/app
    command: pytest tests/ -v

  # Serviço do Estúdio Web de Satélite e Postes
  auxcad-mapa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auxcad_mapa_servidor
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app:/app/cqt:/app/ambiental:/app/orcamento:/app/topografia:/app/mapa_postes:/app/dados_tecnicos:/app/cpfc:/app/unifilar
    volumes:
      - .:/app
    command: python mapa_postes/mapa_servidor.py 8000
