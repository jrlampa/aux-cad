name: AUX CAD CI Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Testes Unitários e Verificar Cobertura
        env:
          PYTHONPATH: ./:./cqt:./ambiental:./orcamento:./topografia:./mapa_postes:./dados_tecnicos:./cpfc:./unifilar
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=80
