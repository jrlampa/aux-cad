<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta Cartográfica OSM & CAD</title>
    <!-- Leaflet CSS Local -->
    <link rel="stylesheet" href="leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout-wrapper">
        
        <!-- ÁREA PRINCIPAL DO MAPA (Esquerda) -->
        <main class="map-container">
            <!-- Barra Flutuante de Ferramentas sobre o Mapa -->
            <div class="map-floating-bar">
                <div class="layer-selector">
                    <button id="btnLayerOsm" class="btn-layer active" title="OpenStreetMap Padrão">🗺️ OSM</button>
                    <button id="btnLayerEsri" class="btn-layer" title="Satélite ESRI World Imagery">🛰️ Satélite</button>
                    <button id="btnLayerGoogle" class="btn-layer" title="Google Satélite Híbrido">🌍 Híbrido</button>
                </div>
                <div class="map-actions">
                    <button id="btnToggleMedicao" class="btn-action-sm btn-medicao" title="Ativar régua / medição métrica no mapa (Atalho: M)">📏 Régua</button>
                    <button id="btnToggleSnap" class="btn-action-sm btn-snap active" onclick="if(window.SnapMagnetico) window.SnapMagnetico.toggle(null, window.AppState ? window.AppState.map : null)" title="Atrair cursor magneticamente para postes e nós existentes">🧲 Snap: ON</button>
                    <button id="btnToggleTracado" class="btn-action-sm btn-tracado" title="Ativar traçado contínuo de vãos de rede">📐 Modo Traçado</button>
                    <button id="btnToggleAmbiental" class="btn-action-sm btn-ambiental" title="Carregar e exibir restrições ambientais">🌿 Restrições</button>
                    <button id="btnToggleVias" class="btn-action-sm btn-vias active" title="Alternar visualização de vias, calçadas e obstruções">🏙️ Vias: VISÍVEIS</button>
                    <button id="btnLerCadTop" class="btn-action-sm btn-cad-read" title="Clique no desenho do CAD para posicionar o mapa">🎯 Ler DWG</button>
                    <button id="btnSincDwg" class="btn-action-sm btn-cad-sync" title="Carregar postes existentes no DWG">🔄 Sincronizar</button>
                    <button id="btnToggleSidebar" class="btn-action-sm btn-sidebar-toggle" title="Ocultar/Exibir Sidebar">📑 Painel ◀</button>
                </div>
            </div>

            <!-- Painel Flutuante da Ferramenta de Medição (Régua) -->
            <div id="painelMedicao" class="painel-medicao-flutuante" style="display: none;">
                <div class="painel-medicao-header">
                    <span>📏 Régua Métrica (UTM)</span>
                    <button type="button" class="btn-fechar-medicao" onclick="toggleModoMedicao(window.AppState ? window.AppState.map : null)" title="Fechar régua (ESC)">✕</button>
                </div>
                <div class="painel-medicao-body">
                    <div class="medicao-stat">
                        <span class="medicao-stat-label">Total Medido</span>
                        <span id="txtMedicaoTotal" class="medicao-stat-val">0.0 m</span>
                    </div>
                    <div class="medicao-stat">
                        <span class="medicao-stat-label">Último Trecho</span>
                        <span id="txtMedicaoParcial" class="medicao-stat-val">0.0 m</span>
                    </div>
                    <div class="medicao-stat">
                        <span class="medicao-stat-label">Azimute / Vértices</span>
                        <span class="medicao-stat-val"><span id="txtMedicaoAzimute">0°</span> (<span id="txtMedicaoPontos">0 pts</span>)</span>
                    </div>
                </div>
                <div class="painel-medicao-actions">
                    <button type="button" class="btn-med-action" onclick="medirAPartirDoPoste(window.AppState ? window.AppState.map : null)" title="Iniciar régua a partir do poste atual">📍 Do Poste</button>
                    <button type="button" class="btn-med-action" onclick="posicionarPosteNoUltimoPonto(window.AppState ? window.AppState.map : null)" title="Mover marcador do poste para cá">📍 Poste Aqui</button>
                    <button type="button" class="btn-med-action btn-limpar-med" onclick="limparMedicao(window.AppState ? window.AppState.map : null)" title="Limpar medição atual">🗑️ Limpar</button>
                </div>
            </div>

            <!-- Mapa Leaflet -->
            <div id="map"></div>
        </main>

        <!-- SIDEBAR LATERAL DE DADOS E COORDENADAS (Direita) -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h3>⚡ LANÇAMENTO DE POSTES</h3>
                <span id="coordBadge" class="badge-fuso">Fuso 23S</span>
            </div>

            <!-- Banner de Auditoria de Restrições Ambientais em Tempo Real -->
            <div id="bannerAmbiental" class="banner-ambiental sem-dados" title="Clique para carregar camada KMZ ambiental">
                <span>🌿 Camada ambiental: clique para carregar KMZ</span>
            </div>

            <!-- Painel Expansível de Traçado Contínuo de Rede -->
            <div id="painelTracado" class="painel-tracado" style="display: none;">
                <div class="tracado-header">
                    <span>📐 Traçado Contínuo de Rede</span>
                    <span id="lblTracadoContagem" class="badge-tracado">0 postes</span>
                </div>
                <div class="tracado-controls">
                    <div class="rede-selector">
                        <button type="button" id="btnRedeBt" class="btn-rede active" onclick="setTipoRedeTracado('BT')">Rede BT (Ciano)</button>
                        <button type="button" id="btnRedeMt" class="btn-rede" onclick="setTipoRedeTracado('MT')">Rede MT (Magenta)</button>
                    </div>
                    <div class="tracado-actions">
                        <span id="lblTracadoUltimo" class="tracado-ultimo-txt">Nenhum poste no traçado</span>
                        <button type="button" id="btnFinalizarTrecho" class="btn-text-action" onclick="finalizarTrecho()" title="Iniciar novo ramal">Novo Ramal</button>
                        <button type="button" id="btnLimparTracado" class="btn-text-action danger" onclick="limparTracado(window.AppState ? window.AppState.map : null)" title="Limpar traçado do mapa">Limpar</button>
                    </div>
                    <div class="tracado-cqt-box" style="margin-top: 6px; padding-top: 6px; border-top: 1px dashed #cbd5e1; display: flex; gap: 4px; align-items: center;">
                        <input type="text" id="inputProjeto" class="input-proj-cqt" placeholder="PE_12345" value="PE_PROJETO_OSM" style="font-size: 11px; padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 4px; flex: 1;" title="Identificação do projeto no CQT">
                        <button type="button" id="btnExportarCqt" class="btn-cqt-export" onclick="exportarParaCqt()" title="Exportar trecho e cargas diretamente para o CQT (Queda de Tensão BT)">⚡ CQT</button>
                    </div>
                </div>
            </div>

            <div class="sidebar-scrollable">
                <!-- Card de Coordenadas -->
                <section class="card-section">
                    <div class="section-title">
                        <span>📍 Coordenadas (UTM)</span>
                        <button type="button" id="btnApagarMarcador" class="btn-text-action danger" title="Remover marcador do mapa">🗑️ Apagar Marcador</button>
                    </div>
                    <div class="grid-2-col">
                        <div class="form-group">
                            <label for="inputX">Este / X (m):</label>
                            <input type="number" id="inputX" step="0.01" placeholder="Ex: 745120.50">
                        </div>
                        <div class="form-group">
                            <label for="inputY">Norte / Y (m):</label>
                            <input type="number" id="inputY" step="0.01" placeholder="Ex: 7482310.80">
                        </div>
                    </div>
                    <div class="grid-2-col" style="margin-top: 6px;">
                        <div class="form-group">
                            <label for="selectFuso">Fuso UTM:</label>
                            <select id="selectFuso">
                                <option value="23" selected>Fuso 23S (RJ/SP/MG)</option>
                                <option value="24">Fuso 24S (ES/BA)</option>
                                <option value="22">Fuso 22S (PR/SC/RS)</option>
                            </select>
                        </div>
                        <div class="form-group" style="align-self: flex-end;">
                            <button id="btnAplicarCoord" class="btn-secondary">Atualizar Marcador</button>
                        </div>
                    </div>
                </section>

                <!-- Card de Dados do Poste -->
                <section class="card-section">
                    <div class="section-title">
                        <span>⚡ Dados do Poste &amp; Estrutura</span>
                        <button type="button" id="btnLimparForm" class="btn-text-action" title="Limpar dados do formulário">🧹 Limpar</button>
                    </div>
                    <div class="grid-3-col">
                        <div class="form-group">
                            <label for="inputNumero">Nº Poste:</label>
                            <input type="text" id="inputNumero" value="01" style="font-weight: bold; text-align: center;">
                        </div>
                        <div class="form-group" style="grid-column: span 2;">
                            <label for="selectTipoPoste">Tipo / Esforço:</label>
                            <select id="selectTipoPoste">
                                <option value="11/600" selected>11m / 600 daN</option>
                                <option value="11/400">11m / 400 daN</option>
                                <option value="11/1000">11m / 1000 daN</option>
                                <option value="12/300">12m / 300 daN</option>
                                <option value="12/600">12m / 600 daN</option>
                                <option value="12/1000">12m / 1000 daN</option>
                                <option value="10/300">10m / 300 daN</option>
                                <option value="11/M">11/M (Madeira)</option>
                                <option value="POSTE EXISTENTE">Existente</option>
                            </select>
                        </div>
                    </div>

                    <!-- Seção de Estruturas MT (Multi-seleção) -->
                    <div class="estruturas-wrapper" style="margin-top: 6px;">
                        <div class="form-group-combo">
                            <label for="selectEstruturaMt">Estruturas MT:</label>
                            <div class="input-with-btn">
                                <select id="selectEstruturaMt">
                                    <option value="" selected>Selecione para adicionar...</option>
                                    <option value="N1">N1 (Passagem)</option>
                                    <option value="N2">N2 (Ângulo)</option>
                                    <option value="N3b">N3b (Ancoragem)</option>
                                    <option value="N4">N4 (Fim de Linha)</option>
                                    <option value="CE1">CE1 (Compacta)</option>
                                    <option value="CE2">CE2 (Compacta Ângulo)</option>
                                    <option value="B1">B1 (Beco)</option>
                                    <option value="B2">B2 (Beco Ângulo)</option>
                                </select>
                                <button type="button" id="btnAddMt" class="btn-add-structure" title="Adicionar estrutura MT">+</button>
                            </div>
                        </div>
                        <div class="chips-container-sm" id="quickChipsMt" style="margin-top: 3px;">
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="mt" data-val="N1">+ N1</button>
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="mt" data-val="N2">+ N2</button>
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="mt" data-val="N3b">+ N3b</button>
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="mt" data-val="CE1">+ CE1</button>
                        </div>
                        <div class="tag-list" id="tagsEstruturasMt">
                            <!-- Tags MT adicionadas dinamicamente -->
                        </div>
                    </div>

                    <!-- Seção de Estruturas BT (Multi-seleção) -->
                    <div class="estruturas-wrapper" style="margin-top: 6px;">
                        <div class="form-group-combo">
                            <label for="selectEstruturaBt">Estruturas BT:</label>
                            <div class="input-with-btn">
                                <select id="selectEstruturaBt">
                                    <option value="" selected>Selecione para adicionar...</option>
                                    <option value="S1">S1 (Passagem)</option>
                                    <option value="S2">S2 (Ângulo)</option>
                                    <option value="F1">F1 (Ancoragem)</option>
                                    <option value="F2-D2">F2-D2 (Fim)</option>
                                    <option value="SI1">SI1 (Isolador)</option>
                                    <option value="SI3">SI3 (Ancoragem Tri)</option>
                                    <option value="SI4">SI4 (Isolador Pino)</option>
                                </select>
                                <button type="button" id="btnAddBt" class="btn-add-structure" title="Adicionar estrutura BT">+</button>
                            </div>
                        </div>
                        <div class="chips-container-sm" id="quickChipsBt" style="margin-top: 3px;">
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="bt" data-val="S1">+ S1</button>
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="bt" data-val="S2">+ S2</button>
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="bt" data-val="F1">+ F1</button>
                            <button type="button" class="chip-sm chip-quick-add" data-tipo="bt" data-val="F2-D2">+ F2-D2</button>
                        </div>
                        <div class="tag-list" id="tagsEstruturasBt">
                            <!-- Tags BT adicionadas dinamicamente -->
                        </div>
                    </div>

                    <!-- Equipamentos Rápidos -->
                    <div class="equip-group" style="margin-top: 8px;">
                        <label class="label-sub">Equipamentos:</label>
                        <div class="chips-container" id="equipChips">
                            <button type="button" class="chip" data-val="IP">💡 IP</button>
                            <button type="button" class="chip" data-val="ATERR">⚡ ATERR</button>
                            <button type="button" class="chip" data-val="DAE">🛡️ DAE</button>
                            <button type="button" class="chip" id="chipTrafo" data-val="TRAFO">🔋 Trafo <span id="lblTrafoKva">45kVA</span></button>
                            <button type="button" class="chip" data-val="CHAVE FUSIVEL">🔌 Chave Fus.</button>
                            <button type="button" class="chip" data-val="PARA-RAIOS">⚡ P-Raios</button>
                        </div>

                        <!-- Painel de Configuração do Trafo (Exibido quando Trafo ativo) -->
                        <div id="painelTrafo" class="trafo-power-panel" style="display: none; margin-top: 6px;">
                            <div class="form-group">
                                <label for="selectPotenciaTrafo" style="font-size: 11px; font-weight: bold; color: #0284c7;">⚡ Potência do Transformador (Bloco "T"):</label>
                                <div class="grid-2-col">
                                    <select id="selectPotenciaTrafo">
                                        <option value="15kVA">15 kVA (Mono/Trifásico)</option>
                                        <option value="30kVA">30 kVA (Trifásico)</option>
                                        <option value="45kVA" selected>45 kVA (Trifásico - Padrão)</option>
                                        <option value="75kVA">75 kVA (Trifásico)</option>
                                        <option value="112.5kVA">112.5 kVA (Trifásico)</option>
                                        <option value="150kVA">150 kVA (Trifásico)</option>
                                        <option value="225kVA">225 kVA (Trifásico)</option>
                                        <option value="300kVA">300 kVA (Trifásico)</option>
                                        <option value="OUTRO">Outra Potência...</option>
                                    </select>
                                    <input type="text" id="inputPotenciaCustom" placeholder="Ex: 50kVA" style="display: none;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Consumidores BT (CQT) -->
                    <div class="clientes-group" style="margin-top: 8px;">
                        <label class="label-sub">Consumidores BT (CQT):</label>
                        <div class="grid-3-col" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;">
                            <div class="form-group">
                                <label for="inputMono" style="font-size: 10px; color: #64748b;">Mono:</label>
                                <input type="number" id="inputMono" min="0" value="0" style="text-align: center; font-size: 12px; padding: 2px;">
                            </div>
                            <div class="form-group">
                                <label for="inputBi" style="font-size: 10px; color: #64748b;">Bi:</label>
                                <input type="number" id="inputBi" min="0" value="0" style="text-align: center; font-size: 12px; padding: 2px;">
                            </div>
                            <div class="form-group">
                                <label for="inputTri" style="font-size: 10px; color: #64748b;">Tri:</label>
                                <input type="number" id="inputTri" min="0" value="0" style="text-align: center; font-size: 12px; padding: 2px;">
                            </div>
                        </div>
                    </div>

                    <!-- Carga Especial Trifásica -->
                    <div class="carga-group">
                        <label class="label-sub">Carga Especial Trifásica (FP = 0.92):</label>
                        <div class="grid-2-col">
                            <div class="form-group">
                                <input type="number" id="inputKva" step="0.1" placeholder="Potência kVA">
                            </div>
                            <div class="form-group">
                                <input type="number" id="inputKw" step="0.1" placeholder="Potência kW">
                            </div>
                        </div>
                        <div class="chips-container-sm" id="cargaChips">
                            <button type="button" class="chip-sm" data-nome="BOMBA" data-kw="15">Bomba 15kW</button>
                            <button type="button" class="chip-sm" data-nome="MOTOR" data-kw="7.5">Motor 7.5kW</button>
                            <button type="button" class="chip-sm" data-nome="COMERCIO" data-kw="20">Comércio 20kW</button>
                            <button type="button" class="chip-sm" data-nome="SERRALHERIA" data-kw="10">Serralheria 10kW</button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- Rodapé Fixo da Sidebar com Botão Master -->
            <footer class="sidebar-footer">
                <button id="btnInserirCad" class="btn-primary-cad">
                    📍 INSERIR POSTE NO CAD
                </button>
                <div class="checkbox-auto-inc">
                    <label>
                        <input type="checkbox" id="chkAutoInc" checked>
                        Incrementar Nº (+1) após inserir
                    </label>
                </div>
                <div id="statusToast" class="status-toast">
                    Pronto para lançar.
                </div>
            </footer>
        </aside>
    </div>

    <!-- Scripts Locais -->
    <script src="leaflet.js"></script>
    <script src="snyder.js"></script>
    <script src="snap_magnetico.js"></script>
    <script src="medicao.js"></script>
    <script src="tracado.js"></script>
    <script src="ambiental_overlay.js"></script>
    <script src="vias_obstrucoes.js"></script>
    <script src="app.js"></script>
</body>
</html>
